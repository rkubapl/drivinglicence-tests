spring.application.name=drivinglicencetest
spring.datasource.url=jdbc:postgresql://localhost:5432/drivinglicence?useUnicode=yes&characterEncoding=UTF-8
spring.datasource.username=admin
spring.datasource.password=admin

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.servlet.encoding.enabled=true
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/drivinglicence